classSrcDir: "./app/src/main/java/org/projectkickstart/templates/"

resSrcDir: "./app/src/main/res/layout/"

outDir: "./.templates/"

templates:
  - type: activity
    path: mvvmactivity
    name: Name
    layout: activity_${camelCaseToUnderscore(name)}.xml
    layoutFrom: activity_name.xml
    templateName: MVVMActivity
    templateDescription: Create an MVVM activity
    parameterName: Activity Name
    parameterHelp: Name for the Activity
 
  - type: adapter
    path: mvvmadapter
    name: Name
    layout: ${camelCaseToUnderscore(name)}_list_item.xml
    layoutFrom: name_list_item.xml
    templateName: MVVMAdapter
    templateDescription: Create an MVVM adapter
    parameterName: Adapter Name
    parameterHelp: Name for the Adapter
 
  - type: fragment
    path: mvvmfragment
    name: Info
    layout: fragment_${camelCaseToUnderscore(name)}.xml
    layoutFrom: fragment_info.xml
    templateName: MVVMFragment
    templateDescription: Create an MVVM fragment
    parameterName: Fragment Name
    parameterHelp: Name for the Fragment

  - type: adapter
    path: mvvmpagedadapter
    name: Employee
    layout: ${camelCaseToUnderscore(name)}_list_item.xml
    layoutFrom: employee_list_item.xml
    templateName: MVVMPagingAdapter
    templateDescription: Crate a Paging Adapter
    parameterName: Adapter Name
    parameterHelp: Name for the Adapter
    
